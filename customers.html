<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ShopSphere | Customers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root {
    --green:#18b89a;
    --light:#f6f8f8;
}

* {
    box-sizing: border-box;
}

body {
    background:var(--light);
    font-family:Arial;
    margin:0;
}




.sidebar {
    position:fixed;
    width:250px;
    height:100vh;
    background:white;
    padding:25px 15px;
    border-right:1px solid #eee;
    left:0;
    top:0;
    z-index:1000;
    transition:0.3s;
}

.logo {
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span {
    color:var(--green);
}

.sidebar a {
    display:block;
    padding:13px 15px;
    margin-bottom:7px;
    text-decoration:none;
    color:#555;
    border-radius:10px;
}

.sidebar a i {
    width:25px;
}

.sidebar a:hover,
.sidebar a.active {
    background:rgba(24,184,154,.12);
    color:var(--green);
}




.mobile-navbar {
    display:none;
    background:white;
    padding:15px 20px;
    border-radius:12px;
    margin-bottom:20px;
    align-items:center;
    justify-content:space-between;
}

.mobile-navbar strong {
    font-size:20px;
}

.mobile-navbar button {
    border:none;
    background:transparent;
    color:var(--green);
    font-size:24px;
}




.main {
    margin-left:250px;
    padding:30px;
}




.box {
    background:white;
    border-radius:15px;
    padding:25px;
}




.customer-icon {
    width:45px;
    height:45px;
    background:#dff7f1;
    color:var(--green);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}



@media (max-width: 991px) {

    .sidebar {
        left:-250px;
    }

    .sidebar.show {
        left:0;
    }

    .main {
        margin-left:0 !important;
        padding:20px;
        width:100%;
    }

    .mobile-navbar {
        display:flex;
    }

}



@media (max-width: 576px) {

    .main {
        padding:15px;
    }

    .box {
        padding:18px;
    }

    .box h2 {
        font-size:24px;
    }

    /*
       الجدول يفضل قابل للسحب أفقيًا
       بدل ما الكلام يتكسر ويبوظ التصميم
    */

    .table-responsive {
        overflow-x:auto;
    }

    .table {
        min-width:650px;
    }

}

</style>

</head>

<body>


<div class="sidebar" id="sidebar">

    <div class="logo">
        Shop<span>Sphere</span>
    </div>

    <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        Dashboard
    </a>

    <a href="products.html">
        <i class="fa-solid fa-box"></i>
        Products
    </a>

    <a href="orders.html">
        <i class="fa-solid fa-cart-shopping"></i>
        Orders
    </a>

    <a href="customers.html" class="active">
        <i class="fa-solid fa-users"></i>
        Customers
    </a>

    <a href="reviews.html">
        <i class="fa-solid fa-star"></i>
        Reviews
    </a>

    <hr>

    <a href="analytics.html">
        <i class="fa-solid fa-chart-line"></i>
        Analytics
    </a>

    <a href="settings.html">
        <i class="fa-solid fa-gear"></i>
        Settings
    </a>

    <a href="index.html">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>

</div>


<!-- ================= MAIN ================= -->

<div class="main">


    <!-- MOBILE NAVBAR -->

    <div class="mobile-navbar">

        <strong>
            Shop<span style="color:#18b89a;">Sphere</span>
        </strong>

        <button onclick="toggleSidebar()">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>


    <div class="box">

        <h2>Customers</h2>

        <p class="text-muted">
            Manage your customers
        </p>


        <div class="table-responsive">

            <table class="table align-middle mt-4">

                <thead>

                    <tr>

                        <th>Customer</th>
                        <th>Email</th>
                        <th>Orders</th>
                        <th>Total Spent</th>
                        <th>Status</th>

                    </tr>

                </thead>


                <tbody>


                    <tr>

                        <td>

                            <div class="d-flex align-items-center gap-3">

                                <div class="customer-icon">
                                    <i class="fa-solid fa-user"></i>
                                </div>

                                Sarah Ahmed

                            </div>

                        </td>

                        <td>sarah@example.com</td>

                        <td>12</td>

                        <td>$1,240</td>

                        <td>
                            <span class="badge text-bg-success">
                                Active
                            </span>
                        </td>

                    </tr>


                    <tr>

                        <td>

                            <div class="d-flex align-items-center gap-3">

                                <div class="customer-icon">
                                    <i class="fa-solid fa-user"></i>
                                </div>

                                Mona Ali

                            </div>

                        </td>

                        <td>mona@example.com</td>

                        <td>8</td>

                        <td>$850</td>

                        <td>
                            <span class="badge text-bg-success">
                                Active
                            </span>
                        </td>

                    </tr>


                    <tr>

                        <td>

                            <div class="d-flex align-items-center gap-3">

                                <div class="customer-icon">
                                    <i class="fa-solid fa-user"></i>
                                </div>

                                Omar Hassan

                            </div>

                        </td>

                        <td>omar@example.com</td>

                        <td>5</td>

                        <td>$540</td>

                        <td>
                            <span class="badge text-bg-secondary">
                                Inactive
                            </span>
                        </td>

                    </tr>


                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .toggle("show");

}

</script>


</body>
</html>
