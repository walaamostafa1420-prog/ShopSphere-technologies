<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --green: #18b89a;
        }

        body {
            background: #f6f8f8;
            font-family: Arial, sans-serif;
        }

        .cart-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .green-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

        .green-btn:hover {
            background: #119b82;
            color: white;
        }

        .quantity {
            width: 65px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <h2 class="mb-4">Shopping Cart</h2>

    <div class="cart-box">

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="cartItems"></tbody>
            </table>
        </div>

        <h4 class="text-end mt-4">
            Total: $<span id="grandTotal">0</span>
        </h4>

        <div class="text-end mt-3">
            <a href="index.html" class="btn btn-outline-secondary">
                Continue Shopping
            </a>

            <a href="checkout.html" class="green-btn" id="checkoutBtn">
                Proceed to Checkout
            </a>
        </div>

        <p id="emptyMessage" class="text-center text-muted mt-3"
           style="display:none;">
            Your cart is empty. Start shopping!
        </p>

    </div>

</div>

<script>
    // Demo products
    let cart = [
        { id: 1, name: "Smart Watch", price: 120, quantity: 1 },
        { id: 2, name: "Wireless Headphones", price: 85, quantity: 1 },
        { id: 3, name: "AirPods", price: 129, quantity: 1 }
    ];

    function displayCart() {
        const cartItems = document.getElementById("cartItems");
        cartItems.innerHTML = "";

        let total = 0;

        cart.forEach((item, index) => {
            let itemTotal = item.price * item.quantity;
            total += itemTotal;

            cartItems.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>$${item.price}</td>
                    <td>
                        <input type="number" min="1"
                            value="${item.quantity}"
                            class="form-control quantity"
                            onchange="updateQuantity(${index}, this.value)">
                    </td>
                    <td>$${itemTotal}</td>
                    <td>
                        <button class="btn btn-danger btn-sm"
                            onclick="removeItem(${index})">
                            Remove
                        </button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("grandTotal").textContent = total;

        document.getElementById("emptyMessage").style.display =
            cart.length === 0 ? "block" : "none";

        document.getElementById("checkoutBtn").style.display =
            cart.length === 0 ? "none" : "inline-block";
    }

    function updateQuantity(index, value) {
        let quantity = parseInt(value);

        if (quantity < 1 || isNaN(quantity)) {
            quantity = 1;
        }

        cart[index].quantity = quantity;
        displayCart();
    }

    function removeItem(index) {
        cart.splice(index, 1);
        displayCart();
    }

    displayCart();
    </script>
    </body>
    </html>
