<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ShopSphere | Settings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root {
    --green:#18b89a;
    --light:#f6f8f8;
}

body {
    background:var(--light);
    font-family:Arial;
}

.sidebar {
    position:fixed;
    width:250px;
    height:100vh;
    background:white;
    padding:25px 15px;
}

.logo {
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span {
    color:var(--green);
}

.sidebar a {
    display:block;
    padding:13px 15px;
    margin-bottom:7px;
    text-decoration:none;
    color:#555;
    border-radius:10px;
}

.sidebar a i {
    width:25px;
}

.sidebar a:hover,
.sidebar a.active {
    background:rgba(24,184,154,.12);
    color:var(--green);
}

.main {
    margin-left:250px;
    padding:30px;
}

.box {
    background:white;
    border-radius:15px;
    padding:30px;
}

.green-btn {
    background:var(--green);
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
}

.form-control:focus {
    border-color:var(--green);
    box-shadow:0 0 0 .2rem rgba(24,184,154,.2);
}

</style>

</head>

<body>


<div class="sidebar">

<div class="logo">
Shop<span>Sphere</span>
</div>

<a href="dashboard.html">
<i class="fa-solid fa-house"></i>
Dashboard
</a>

<a href="products.html">
<i class="fa-solid fa-box"></i>
Products
</a>

<a href="orders.html">
<i class="fa-solid fa-cart-shopping"></i>
Orders
</a>

<a href="customers.html">
<i class="fa-solid fa-users"></i>
Customers
</a>

<a href="reviews.html">
<i class="fa-solid fa-star"></i>
Reviews
</a>

<hr>

<a href="analytics.html">
<i class="fa-solid fa-chart-line"></i>
Analytics
</a>

<a href="settings.html" class="active">
<i class="fa-solid fa-gear"></i>
Settings
</a>

<a href="index.html">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</a>

</div>


<div class="main">

<div class="box">

<h2>Settings</h2>

<p class="text-muted">
Manage your store settings
</p>

<hr>


<div class="mb-3">

<label class="form-label">
Store Name
</label>

<input
type="text"
class="form-control"
value="ShopSphere Technologies">

</div>


<div class="mb-3">

<label class="form-label">
Admin Email
</label>

<input
type="email"
class="form-control"
value="admin@shopsphere.com">

</div>


<div class="mb-3">

<label class="form-label">
Phone Number
</label>

<input
type="text"
class="form-control"
placeholder="+20 100 000 0000">

</div>


<div class="mb-3">

<label class="form-label">
Store Description
</label>

<textarea
class="form-control"
rows="4">Smart Shopping Experience</textarea>

</div>


<button class="green-btn">

<i class="fa-solid fa-check"></i>

Save Changes

</button>

</div>

</div>

</body>
</html>
