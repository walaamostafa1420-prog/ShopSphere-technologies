<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ShopSphere | Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root {
    --green:#18b89a;
    --light:#f6f8f8;
}

body {
    background:var(--light);
    font-family:Arial;
}

.sidebar {
    position:fixed;
    width:250px;
    height:100vh;
    background:white;
    padding:25px 15px;
    border-right:1px solid #eee;
}

.logo {
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span {
    color:var(--green);
}

.sidebar a {
    display:block;
    padding:13px 15px;
    margin-bottom:7px;
    text-decoration:none;
    color:#555;
    border-radius:10px;
}

.sidebar a i {
    width:25px;
}

.sidebar a:hover,
.sidebar a.active {
    background:rgba(24,184,154,.12);
    color:var(--green);
}

.main {
    margin-left:250px;
    padding:30px;
}

.box {
    background:white;
    border-radius:15px;
    padding:25px;
}

.product-card {
    border:1px solid #eee;
    border-radius:12px;
    overflow:hidden;
    background:white;
    transition:.3s;
}

.product-card:hover {
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.product-card img {
    width:100%;
    height:200px;
    object-fit:cover;
}

.green-btn {
    background:var(--green);
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
}

.green-btn:hover {
    background:#119b82;
    color:white;
}
/* Shopping Cart */

.cart-section {
    display: none;
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.cart-item img {
    width: 75px;
    height: 75px;
    object-fit: cover;
    border-radius: 10px;
}

.quantity-btn {
    border: 1px solid #ddd;
    background: white;
    padding: 4px 10px;
    border-radius: 5px;
}

.cart-total {
    color: var(--green);
    font-size: 22px;
    font-weight: bold;
}

@media (max-width: 768px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
        padding: 15px;
    }

    .cart-item {
        flex-wrap: wrap;
    }
}

</style> 

</head>

<body>


<div class="sidebar">

    <div class="logo">
        Shop<span>Sphere</span>
    </div>

    <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        Dashboard
    </a>

    <a href="products.html" class="active">
        <i class="fa-solid fa-box"></i>
        Products
    </a>

    <a href="orders.html">
        <i class="fa-solid fa-cart-shopping"></i>
        Orders
    </a>

    <a href="customers.html">
        <i class="fa-solid fa-users"></i>
        Customers
    </a>

    <a href="reviews.html">
        <i class="fa-solid fa-star"></i>
        Reviews
    </a>

    <hr>

    <a href="analytics.html">
        <i class="fa-solid fa-chart-line"></i>
        Analytics
    </a>

    <a href="settings.html">
        <i class="fa-solid fa-gear"></i>
        Settings
    </a>

    <a href="index.html">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>

</div>


<div class="main">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

    <div>
        <h2>Products</h2>
        <p class="text-muted">Manage your store products</p>
    </div>

    <button class="green-btn" onclick="toggleCart()">
        <i class="fa-solid fa-cart-shopping"></i>
        Cart (<span id="cartCount">0</span>)
    </button>

</div>

<div class="cart-section" id="cartSection">

    <h3 class="mb-4">
        <i class="fa-solid fa-cart-shopping"></i>
        Shopping Cart
    </h3>

    <div id="cartItems"></div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-4">

        <h5>Total:</h5>

        <span class="cart-total" id="cartTotal">$0</span>

    </div>

    <button class="green-btn mt-3" onclick="checkout()">
        Proceed to Checkout
        <i class="fa-solid fa-arrow-right"></i>
    </button>

</div>


    <div class="row g-4">

    <div class="col-12 col-md-6 col-lg-4">
        <div class="product-card h-100">
            <img src="images/WhatsApp Image 2026-08-06 at 8.04.33 AM.jpeg"
                 alt="Smart Watch">

            <div class="p-3">
                <h5>Smart Watch</h5>
                <p class="text-muted">Electronics</p>
                <h5>$250</h5>

                <button class="btn btn-outline-success btn-sm">
                    Edit
                </button>

                <button class="btn btn-outline-danger btn-sm">
                    Delete
                </button>

                <button class="green-btn w-100 mt-3"
                    onclick="addToCart(1, 'Smart Watch', 250, 'images/WhatsApp Image 2026-08-06 at 8.04.33 AM.jpeg')">
                    <i class="fa-solid fa-cart-plus"></i>
                    Add to Cart
                </button>
            </div>
        </div>
    </div>

    
    <div class="col-12 col-md-6 col-lg-4">
        <div class="product-card h-100">
            <img src="images/WhatsApp Image 2026-08-06 at 2.47.23 AM.jpeg"
                 alt="AirPods Pro 3">

            <div class="p-3">
                <h5>AirPods Pro 3</h5>
                <p class="text-muted">Electronics</p>
                <h5>$249</h5>

                <button class="btn btn-outline-success btn-sm">
                    Edit
                </button>

                <button class="btn btn-outline-danger btn-sm">
                    Delete
                </button>

                <button class="green-btn w-100 mt-3"
                    onclick="addToCart(2, 'AirPods Pro 3', 249, 'images/WhatsApp Image 2026-08-06 at 2.47.23 AM.jpeg')">
                    <i class="fa-solid fa-cart-plus"></i>
                    Add to Cart
                </button>
            </div>
        </div>
    </div>

    
    <div class="col-12 col-md-6 col-lg-4">
        <div class="product-card h-100">
            <img src="images/WhatsApp Image 2026-08-06 at 2.47.14 AM.jpeg"
                 alt="Canon EOS R50">

            <div class="p-3">
                <h5>Canon EOS R50</h5>
                <p class="text-muted">Cameras</p>
                <h5>$700</h5>

                <button class="btn btn-outline-success btn-sm">
                    Edit
                </button>

                <button class="btn btn-outline-danger btn-sm">
                    Delete
                </button>

                <button class="green-btn w-100 mt-3"
                    onclick="addToCart(3, 'Canon EOS R50', 700, 'images/WhatsApp Image 2026-08-06 at 2.47.14 AM.jpeg')">
                    <i class="fa-solid fa-cart-plus"></i>
                    Add to Cart
                </button>
            </div>
        </div>
    </div>

</div>
<script src="./ShopSphere.js?v=2"defer></script>
</body>
</html>
