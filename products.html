<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ShopSphere | Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root {
    --green:#18b89a;
    --light:#f6f8f8;
}

* {
    box-sizing: border-box;
}

body {
    background:var(--light);
    font-family:Arial;
    margin:0;
}


.sidebar {
    position:fixed;
    width:250px;
    height:100vh;
    background:white;
    padding:25px 15px;
    border-right:1px solid #eee;
    left:0;
    top:0;
    z-index:1000;
    transition:0.3s;
}

.logo {
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span {
    color:var(--green);
}

.sidebar a {
    display:block;
    padding:13px 15px;
    margin-bottom:7px;
    text-decoration:none;
    color:#555;
    border-radius:10px;
}

.sidebar a i {
    width:25px;
}

.sidebar a:hover,
.sidebar a.active {
    background:rgba(24,184,154,.12);
    color:var(--green);
}


.mobile-navbar {
    display:none;
    background:white;
    padding:15px 20px;
    border-radius:12px;
    margin-bottom:20px;
    align-items:center;
    justify-content:space-between;
}

.mobile-navbar strong {
    font-size:20px;
}

.mobile-navbar button {
    border:none;
    background:transparent;
    color:var(--green);
    font-size:24px;
}


.main {
    margin-left:250px;
    padding:30px;
}

.box {
    background:white;
    border-radius:15px;
    padding:25px;
}


.product-card {
    border:1px solid #eee;
    border-radius:12px;
    overflow:hidden;
    background:white;
    transition:.3s;
    height:100%;
}

.product-card:hover {
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.product-card img {
    width:100%;
    height:200px;
    object-fit:cover;
}

.green-btn {
    background:var(--green);
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
}

.green-btn:hover {
    background:#119b82;
    color:white;
}


@media (max-width: 991px) {

    
    .sidebar {
        left:-250px;
    }

    .sidebar.show {
        left:0;
    }

    .main {
        margin-left:0 !important;
        padding:20px;
        width:100%;
    }

    .mobile-navbar {
        display:flex;
    }

}

@media (max-width: 576px) {

    .main {
        padding:15px;
    }

    .box {
        padding:18px;
    }

    .box h2 {
        font-size:24px;
    }

    .box .d-flex {
        gap:15px;
    }

    .green-btn {
        padding:8px 12px;
        font-size:14px;
    }

    .product-card img {
        height:220px;
    }

}

</style>

</head>

<body>


<div class="sidebar" id="sidebar">

    <div class="logo">
        Shop<span>Sphere</span>
    </div>

    <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        Dashboard
    </a>

    <a href="products.html" class="active">
        <i class="fa-solid fa-box"></i>
        Products
    </a>

    <a href="orders.html">
        <i class="fa-solid fa-cart-shopping"></i>
        Orders
    </a>

    <a href="customers.html">
        <i class="fa-solid fa-users"></i>
        Customers
    </a>

    <a href="reviews.html">
        <i class="fa-solid fa-star"></i>
        Reviews
    </a>

    <hr>

    <a href="analytics.html">
        <i class="fa-solid fa-chart-line"></i>
        Analytics
    </a>

    <a href="settings.html">
        <i class="fa-solid fa-gear"></i>
        Settings
    </a>

    <a href="index.html">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>

</div>


<div class="main">




    <div class="mobile-navbar">

        <strong>
            Shop<span style="color:#18b89a;">Sphere</span>
        </strong>

        <button onclick="toggleSidebar()">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>

    <div class="box mb-4">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h2>Products</h2>

                <p class="text-muted">
                    Manage your store products
                </p>

            </div>

            <button class="green-btn">

                <i class="fa-solid fa-plus"></i>

                Add Product

            </button>

        </div>

    </div>
    <div class="row g-4">
        <div class="col-lg-4 col-md-6 col-12">

            <div class="product-card">

                <img src="images/WhatsApp Image 2026-08-06 at 8.04.33 AM.jpeg">

                <div class="p-3">

                    <h5>Smart Watch</h5>

                    <p class="text-muted">
                        Electronics
                    </p>

                    <h5>$250</h5>

                    <button class="btn btn-outline-success btn-sm">
                        Edit
                    </button>

                    <button class="btn btn-outline-danger btn-sm">
                        Delete
                    </button>

                </div>

            </div>

        </div>


        <!-- PRODUCT 2 -->

        <div class="col-lg-4 col-md-6 col-12">

            <div class="product-card">

                <img src="images/WhatsApp Image 2026-08-06 at 2.47.23 AM.jpeg">

                <div class="p-3">

                    <h5>Air pods Pro 3</h5>

                    <p class="text-muted">
                        Electronics
                    </p>

                    <h5>$249</h5>

                    <button class="btn btn-outline-success btn-sm">
                        Edit
                    </button>

                    <button class="btn btn-outline-danger btn-sm">
                        Delete
                    </button>

                </div>

            </div>

        </div>

        <div class="col-lg-4 col-md-6 col-12">

            <div class="product-card">

                <img src="images/WhatsApp Image 2026-08-06 at 2.47.14 AM.jpeg">

                <div class="p-3">

                    <h5>Canon EOS R50</h5>

                    <p class="text-muted">
                        Fashion
                    </p>

                    <h5>$800</h5>

                    <button class="btn btn-outline-success btn-sm">
                        Edit
                    </button>

                    <button class="btn btn-outline-danger btn-sm">
                        Delete
                    </button>

                </div>

            </div>

        </div>


    </div>

</div>


<script>

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .toggle("show");

}

</script>


</body>
</html>
